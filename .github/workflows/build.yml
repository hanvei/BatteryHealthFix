name: Build BatteryHealthFix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          cd ~/theos && git submodule update --init --recursive || true

          echo "=== 本机可用的 iPhoneOS SDK ==="
          ls -d $(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk 2>/dev/null
          echo "=== 可用工具链 ==="
          ls -d $(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain 2>/dev/null

      - name: Build
        run: |
          export THEOS=$HOME/theos
          # 让 theos 自动找最新的 SDK，不硬编码版本号
          make clean 2>/dev/null || true
          make package THEOS=$THEOS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHealthFix-deb
          path: packages/*.deb
          if-no-files-found: error
