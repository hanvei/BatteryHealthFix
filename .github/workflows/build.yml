name: Build BatteryHealthFix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          echo "=== Xcode ==="
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path || true

          echo "=== Theos ==="
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          cd ~/theos && git submodule update --init --recursive || true

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export SDKVERSION=16.5
          make clean 2>/dev/null || true
          make package THEOS=$THEOS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHealthFix-deb
          path: packages/*.deb
          if-no-files-found: error
