name: Build BatteryHealthFix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git curl make clang llvm lzma
          git clone --depth 1 https://github.com/theos/theos.git ~/theos && cd ~/theos && git submodule update --init --recursive || true
          curl -sL "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" -o /tmp/sdks.tar.gz
          mkdir -p ~/theos/sdks && tar xzf /tmp/sdks.tar.gz -C ~/theos/sdks --strip-components=1
          ls ~/theos/sdks/
          for url in \
            "https://github.com/kabiroberai/theos-toolchain-linux/releases/download/2023.05/iphoneos-toolchain.tar.gz" \
            "https://github.com/kabiroberai/theos-toolchain-linux/releases/download/2024.01/iphoneos-toolchain.tar.gz"; do
            curl -fL -o /tmp/toolchain.tar.gz "$url" && break
          done
          sudo tar xzf /tmp/toolchain.tar.gz -C /usr/local/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          ls -la
          make clean 2>/dev/null || true
          make package THEOS=$THEOS 2>&1 | tail -20 || echo "Theos 失败"
          ls packages/ 2>/dev/null || true

      - name: Fallback
        if: failure()
        run: |
          export THEOS=$HOME/theos
          SDK=$(ls $THEOS/sdks/ | grep -i iphoneos | head -1)
          clang -arch arm64 -fobjc-arc -shared -fPIC -isysroot $THEOS/sdks/$SDK -I $THEOS/include -o BatteryHealthFix.dylib Tweak.xm -lobjc -framework IOKit 2>&1 | tail -10 || true
          mkdir -p pkg/Library/Tweaks pkg/DEBIAN
          cp BatteryHealthFix.dylib pkg/Library/Tweaks/
          cp BatteryHealthFix.plist pkg/Library/Tweaks/
          cp control pkg/DEBIAN/
          cp postinst pkg/DEBIAN/
          chmod 755 pkg/DEBIAN/post*
          dpkg-deb --build pkg BatteryHealthFix.deb 2>/dev/null || true
          ls -la *.deb 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHealthFix-deb
          path: packages/*.deb
          if-no-files-found: warn
