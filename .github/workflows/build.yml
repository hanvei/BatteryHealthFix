name: Build BatteryHealthFix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          cd ~/theos && git submodule update --init --recursive || true
          curl -sL "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" -o /tmp/sdks.tar.gz
          mkdir -p ~/theos/sdks
          tar xzf /tmp/sdks.tar.gz -C ~/theos/sdks --strip-components=1
          ls ~/theos/sdks/ | grep iphoneos

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make clean 2>/dev/null || true
          make package THEOS=$THEOS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHealthFix-deb
          path: packages/*.deb
          if-no-files-found: error
