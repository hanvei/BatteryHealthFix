name: Build BatteryHealthFix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kabiroberai/theos:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build tweak
        run: |
          export THEOS=/theos
          echo "=== 当前目录 ===" && ls -la
          echo "=== THEOS 路径 ===" && ls -la /theos 2>&1 | head -10
          echo "=== 开始编译 ==="
          make clean || true
          make package THEOS=/theos

      - name: Check build output
        run: |
          echo "=== 编译产物 ==="
          ls -la packages/ 2>/dev/null || echo "packages/ 不存在"
          find . -name "*.deb" 2>/dev/null

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHealthFix-deb
          path: packages/*.deb
          if-no-files-found: error
